[project]
name = "aidlc"
version = "0.1.0"
description = "Local AI-DLC pipeline connecting Jira to this repository"
requires-python = ">=3.11"
dependencies = [
    # MCP client. The pipeline speaks MCP itself rather than asking a model to
    # call tools in prose (ADR-0005).
    "mcp>=1.2",
    # .env loading. The alternative was reading os.environ directly, which gives
    # no single place to document or validate configuration.
    "python-dotenv>=1.0",
    # Transitive via mcp, but imported directly by jira/mcp_client.probe, so
    # declared explicitly rather than relied on by accident.
    "httpx2",
]

# CLI uses stdlib argparse deliberately: click/typer would be nicer but adding a
# dependency for three subcommands is not worth the supply chain.
[project.scripts]
aidlc = "aidlc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidlc"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
